server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip the HTML for faster loads.
    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    # Security headers. The app makes no external network calls, so a strict
    # content-security-policy is safe and keeps it that way.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob:; base-uri 'self'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML so students always get the latest version.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
