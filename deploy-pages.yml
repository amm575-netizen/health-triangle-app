name: Deploy to GitHub Pages

# Publishes the app as a free public web page at
#   https://<your-username>.github.io/<repo-name>/
# every time you push to main. This is optional — it's the simplest way to
# get a clickable link without running the Docker container yourself.
#
# TURN IT ON ONCE: in your repo, go to Settings > Pages and set
#   "Build and deployment" > Source = GitHub Actions.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
